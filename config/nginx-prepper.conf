# PrepperPi — nginx site yapılandırması
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/prepper;
    index index.html;
    charset utf-8;

    access_log off;
    error_log /var/log/nginx/error.log crit;

    # --- Captive portal algılama adresleri -> portala yönlendir ---
    location = /generate_204        { return 302 http://@AP_IP@/; }   # Android
    location = /gen_204             { return 302 http://@AP_IP@/; }
    location = /hotspot-detect.html { return 302 http://@AP_IP@/; }   # Apple
    location = /library/test/success.html { return 302 http://@AP_IP@/; }
    location = /ncsi.txt            { return 302 http://@AP_IP@/; }   # Windows
    location = /connecttest.txt     { return 302 http://@AP_IP@/; }
    location = /redirect            { return 302 http://@AP_IP@/; }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /status.json {
        add_header Cache-Control "no-store";
        try_files /status.json =404;
    }

    # --- Kiwix: Wikipedia, WikiMed, ... ---
    location = /wiki { return 301 /wiki/; }
    location /wiki/ {
        proxy_pass http://127.0.0.1:@KIWIX_PORT@;
        proxy_connect_timeout 5s;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        # Resimler RAM'de veya SD kartta biriktirilmeden doğrudan aktarılır
        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_max_temp_file_size 0;
    }

    # Kitap içeriği (makaleler, resimler) her ZIM sürümünde sabittir:
    # telefonlar önbelleğe alsın, aynı resmi Pi'den tekrar tekrar istemesin.
    location ^~ /wiki/content/ {
        proxy_pass http://127.0.0.1:@KIWIX_PORT@;
        proxy_connect_timeout 5s;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_max_temp_file_size 0;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400";
    }

    # --- Harita verisi (PMTiles, Range istekleriyle istemci tarafında çizilir) ---
    location /data/maps/ {
        alias @DATA_DIR@/maps/;
        add_header Access-Control-Allow-Origin *;
        sendfile on;
    }
    location /data/map-assets/ {
        alias @DATA_DIR@/map-assets/;
        expires 30d;
    }

    # --- Serbest dosyalar: PDF, kitap, video ---
    location /files/ {
        alias @DATA_DIR@/files/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        sendfile on;
    }

    # Kiwix kapalıyken (ör. yeniden başlarken) anlaşılır mesaj
    error_page 502 504 /kiwix-down.html;
    location = /kiwix-down.html { internal; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
