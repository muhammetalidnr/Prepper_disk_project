# PrepperPi ayarları — /etc/prepper.conf
# Değiştirdikten sonra: sudo prepper apply

# Tüm içeriğin (ZIM, harita, dosyalar) duracağı yer.
# USB SSD kullanıyorsanız onu buraya bağlayın (README'ye bakın).
DATA_DIR=/srv/prepper

# Wi-Fi erişim noktası
WIFI_IFACE=wlan0
WIFI_SSID=PrepperPi
WIFI_PASS=hayatta-kal-2026      # en az 8 karakter; boş bırakılırsa açık ağ
WIFI_COUNTRY=TR
WIFI_CHANNEL=6
AP_IP=10.42.0.1

# 1 = her alan adını Pi'ye yönlendir, telefonlarda "ağa giriş" penceresi portalı açar
CAPTIVE=1

# Kiwix (çevrimdışı Wikipedia vb.) iç portu
KIWIX_PORT=8080

# Harita etiket dili
MAP_LANG=tr
